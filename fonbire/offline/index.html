<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f8f9fa; }
        h1 { color: #dc3545; }
        .btn { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    </style>
    <script>
        window.addEventListener('online', () => {
            window.location.href = '/fonbire';
        });

        function checkConnection() {
            if (navigator.onLine) {
                window.location.href = '/fonbire';
            } else {
                alert('Still offline. Please check your internet connection.');
            }
        }
    </script>
</head>
<body>
    <h1>📴 Connection Lost</h1>
    <p>You are currently offline. We will automatically reconnect you when the network returns.</p>
    <button class="btn" onclick="checkConnection()">Retry Now</button>
</body>
</html>
