<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ultra&family=Barlow+Condensed&display=swap" rel="stylesheet">
    <title>2026 Fonbire™</title>
    <link rel="icon" type="image/png" href="/fonbire26.png">
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <meta name="description" content="2026 Fonbire™">
  </head>
  <body>
    <div class="background">
      <div class="content-wrapper">
        <nav class="nav_menu">
          <a href="/sign-up" style="text-decoration: underline; margin-right: 20px;">Become a Dumbfoundonian</a>
          <a href="/" style="text-decoration: underline; margin-right: 20px;">Main Page</a>
          <a href="/blackberry" style="text-decoration: underline; margin-right: 20px;">DumbBerryFounded</a>
        </nav>
        <div class="window">
          <h1>2026 Fonbire™</h1>
        </div>
        <hr>
        <h1 style="font-size: 90px; margin: 20px;">Fonbire Concession Stand™</h1>
        <div class="concession-stand">
          <h2 style="color: white; font-size: 48px;"><i>Get what you want, I don't care.™</i></h2>
          <hr>
          <form action="https://formspree.io/f/xeaozpvl" method="POST">
            <div class="g-recaptcha" data-sitekey="6LeSG8YtAAAAAP7d2hiByFdlN3F5V6WXeOluBiMp" data-callback="revealStuff" id="captcha"></div>
            <div id="stuff" style="display: none;">
              <div>
                <label for="candy">Choose a candy</label>
                <select name="candy" id="candy">
                  <option value="candyBar">Candy Bar</option>
                  <option value="candyKitKat">Kit Kat</option>
                  <option value="candyHersheyBar">Hershey Bar</option>
                  <option value="candyOreo">Oreo</option>
                  <option value="candyCutOut">Cut-Out Cookie Gma</option>
                  <option value="candyNCookie">Cookie</option>
                  <option value="candySmore">Smore</option>
                </select>
              </div>
              <div>
                <label for="snack">Choose a snack</label>
                <select name="snack" id="snack">
                  <option value="snackSterzings">Sterzings</option>
                  <option value="snackLays">Lays</option>
                  <option value="snackDoritos">Doritos</option>
                  <option value="snackPopCorn">PopCorn</option>
                </select>
              </div>
              <div>
                <label for="drink">Choose a drink</label>
                <select name="drink" id="drink">
                  <option value="drinkPepsi">Pepsi</option>
                  <option value="drinkCoke">Coke</option>
                  <option value="drinkMtnDew">Mtn. Dew</option>
                  <option value="drinkPibb">Pibb</option>
                  <option value="drinkWater">Water Bottle</option>
                </select>
              </div>
              <div>
                <input id="name" name="name" placeholder="Enter your name..." style="scale(1.5); position: relative; left: 50%; transform: translateX(-50%); margin: 20px 0;"></input>
                <div class="g-recaptcha" data-sitekey="6LeSG8YtAAAAAP7d2hiByFdlN3F5V6WXeOluBiMp" data-callback="revealSubmit" id="captcha2"></div>
                <button id="submit" class="sbtn">Submit</button>
              </div>
            </div>
          </form>
        </div>
        <hr>
      </div>
    </div>
  </body>
</html>
