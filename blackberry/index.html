  <style type="text/css">
    body {
      background-color: #33ff33;
      background: -webkit-linear-gradient(top, #33ff33, #00aa00);

      padding: 0px;
      height: 100%;

    .content-wrapper {

      width: 100%;

      font-family: 'Arial', 'Helvetica', sans-serif;
      padding: 20px 0;

    @-webkit-keyframes fadeIn {

      border-radius: 15px;

    }

    h1 {
      text-align: center;
      font-size: 36px;
      font-family: "Comic Sans MS", 'Comic Sans', Helvetica, sans-serif;
      color: red;
    }

    h2 {
      text-align: center;
      font-size: 20px;
      font-family: 'Comic Sans MS', 'Comic Sans', Helvetica, sans-serif;
      color: lightblue;
    }

    .nav_menu {
      text-align: center;
      margin-bottom: 20px;
      -webkit-animation: fadeIn 1s ease-in;
      animation: fadeIn 1s ease-in;
    }

    .nav_menu a {
      font-size: 18px;
      margin-right: 15px;
    }

    hr {
      height: 1px;
    }

    a {
      color: #000080;
    }
