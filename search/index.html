<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Search Thingies | Dumbfounded™ Website</title>
    <link rel="icon" type="image/png" href="/DumbfoundedLogo2.png">
  </head>
  <body>
    <input type="text" id="searchInput" placeholder="Search...">
    <button id="searchButton">Search</button>

    <h2>Results:</h2>
    <div id="resultsContainer"></div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const resultsContainer = document.getElementById('resultsContainer');

        function updateUIFromURL() {
            const params = new URLSearchParams(window.location.search);
            const query = (params.get('q') || '').toLowerCase().trim(); 

            searchInput.value = params.get('q') || '';
            resultsContainer.innerHTML = '';

            if (query === '') {
                return;
            }

            if (query === 'test') {
                const title = document.createElement('h1');
                title.textContent = "testum";
                
                const codeBlock = document.createElement('pre');
                codeBlock.textContent = "Dumbfounded™";

                resultsContainer.appendChild(title);
                resultsContainer.appendChild(codeBlock);
            } 
            else {
                const fallback = document.createElement('p');
                fallback.textContent = 'No matching specific layout found for this keyword.';
                resultsContainer.appendChild(fallback);
            }
        }

        searchButton.addEventListener('click', () => {
            const params = new URLSearchParams();
            params.set('q', searchInput.value);

            const newUrl = window.location.pathname + '?' + params.toString();
            window.history.pushState({}, '', newUrl);

            updateUIFromURL();
        });

        window.addEventListener('DOMContentLoaded', updateUIFromURL);
        window.addEventListener('popstate', updateUIFromURL);
    </script>
  </body>
</html>
