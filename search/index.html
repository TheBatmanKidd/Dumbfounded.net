<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Search Thingies | Dumbfounded™ Website</title>
    <link rel="icon" type="image/png" href="/DumbfoundedLogo2.png">
  </head>
  <body>
    <input type="text" id="searchInput" placeholder="Search any word...">
    <button id="searchButton">Search</button>

    <h2>Results:</h2>
    <div id="resultsContainer"></div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const resultsContainer = document.getElementById('resultsContainer');

        async function getPagesFromSitemap() {
            try {
                const response = await fetch('/sitemap.xml');
                if (!response.ok) return [];
                
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                
                const locElements = xmlDoc.getElementsByTagName('loc');
                const urls = [];
                
                for (let i = 0; i < locElements.length; i++) {
                    urls.push(locElements[i].textContent);
                }
                return urls;
            } catch (err) {
                console.error(err);
                return [];
            }
        }

        async function updateUIFromURL() {
            const params = new URLSearchParams(window.location.search);
            const query = (params.get('q') || '').trim(); 

            searchInput.value = query;
            resultsContainer.innerHTML = '';

            if (query === '') {
                return;
            }

            resultsContainer.textContent = 'Scanning site...';

            const pagesToSearch = await getPagesFromSitemap();
            
            if (pagesToSearch.length === 0) {
                resultsContainer.textContent = 'Could not read sitemap.xml to find pages.';
                return;
            }

            let matchCount = 0;
            const containerDiv = document.createElement('div');

            for (const url of pagesToSearch) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) continue;

                    const htmlText = await response.text();

                    if (htmlText.toLowerCase().includes(query.toLowerCase())) {
                        matchCount++;

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(htmlText, 'text/html');
                        const pageTitle = doc.querySelector('title')?.textContent || url;

                        const bodyText = doc.body?.textContent || '';
                        const queryIndex = bodyText.toLowerCase().indexOf(query.toLowerCase());
                        
                        const start = Math.max(0, queryIndex - 40);
                        const end = Math.min(bodyText.length, queryIndex + query.length + 40);
                        let snippet = bodyText.slice(start, end);

                        const regex = new RegExp(`(${query})`, 'gi');
                        snippet = snippet.replace(regex, '<b>\$1</b>');

                        const resultBlock = document.createElement('div');
                        
                        const link = document.createElement('a');
                        link.href = url;
                        link.innerHTML = `<h3>${pageTitle}</h3>`;

                        const preview = document.createElement('p');
                        preview.innerHTML = `...${snippet}...`;

                        resultBlock.appendChild(link);
                        resultBlock.appendChild(preview);
                        containerDiv.appendChild(resultBlock);
                    }
                } catch (err) {
                    console.error(err);
                }
            }

            resultsContainer.innerHTML = '';

            if (matchCount === 0) {
                const noResults = document.createElement('p');
                noResults.textContent = 'No pages contain that word.';
                resultsContainer.appendChild(noResults);
            } else {
                resultsContainer.appendChild(containerDiv);
            }
        }

        searchButton.addEventListener('click', () => {
            const params = new URLSearchParams();
            params.set('q', searchInput.value);

            const newUrl = window.location.pathname + '?' + params.toString();
            window.history.pushState({}, '', newUrl);

            updateUIFromURL();
        });

        window.addEventListener('DOMContentLoaded', updateUIFromURL);
        window.addEventListener('popstate', updateUIFromURL);
    </script>
  </body>
</html>
