<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ultra&family=Barlow+Condensed&display=swap" rel="stylesheet">
    <title>Search Thingies | Dumbfounded™ Website</title>
    <link rel="icon" type="image/png" href="/DumbfoundedLogo2.png">
    <script src="index.js" defer></script>
  </head>
  <body>
    <input type="text" id="searchInput" placeholder="Type 'apple', 'banana', etc...">
    <button id="searchButton">Search</button>

    <h2>Results:</h2>
    <ul id="resultsList"></ul>

    <script>
        const data = ["test"];

        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const resultsList = document.getElementById('resultsList');

        function updateUIFromURL() {
            const params = new URLSearchParams(window.location.search);
            const query = params.get('q') || ''; 

            searchInput.value = query;

            const filteredData = data.filter(item => 
                item.toLowerCase().includes(query.toLowerCase())
            );

            resultsList.innerHTML = '';

            filteredData.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item;
                resultsList.appendChild(li);
            });
        }

        searchButton.addEventListener('click', () => {
            const params = new URLSearchParams();
            params.set('q', searchInput.value);

            const newUrl = window.location.pathname + '?' + params.toString();
            window.history.pushState({}, '', newUrl);

            updateUIFromURL();
        });
        window.addEventListener('DOMContentLoaded', updateUIFromURL);
        window.addEventListener('popstate', updateUIFromURL);
    </script>
  </body>
</html>
