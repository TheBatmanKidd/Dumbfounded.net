<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Search Thingies | Dumbfounded™ Website</title>
    <link rel="icon" type="image/png" href="/DumbfoundedLogo2.png">
  </head>
  <body>
    <input type="text" id="searchInput" placeholder="Search...">
    <button id="searchButton">Search</button>
    <h2>Results:</h2>
    <div id="resultsContainer"></div>
    <script>
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const resultsContainer = document.getElementById('resultsContainer');

        function createTestPageOne() {
            const container = document.createElement('div');
            const heading = document.createElement('h1');
            heading.textContent = "Test Page Alpha";
            const text = document.createElement('p');
            text.textContent = "This is the primary experimental layout block.";
            container.appendChild(heading);
            container.appendChild(text);
            return container;
        }

        function createTestPageTwo() {
            const container = document.createElement('div');
            const heading = document.createElement('h2');
            heading.textContent = "Test Page Beta";
            const pre = document.createElement('pre');
            pre.textContent = "Console Log: Active\nData Stream: Main";
            container.appendChild(heading);
            container.appendChild(pre);
            return container;
        }

        function createTestPageThree() {
            const container = document.createElement('div');
            const heading = document.createElement('h3');
            heading.textContent = "Test Page Gamma";
            const btn = document.createElement('button');
            btn.textContent = "Execute Node Task";
            container.appendChild(heading);
            container.appendChild(btn);
            return container;
        }

        function updateUIFromURL() {
            const params = new URLSearchParams(window.location.search);
            const query = (params.get('q') || '').toLowerCase().trim(); 

            searchInput.value = params.get('q') || '';
            resultsContainer.innerHTML = '';

            if (query === '') {
                return;
            }

            if (query === 'test') {
                const elementLayouts = [
                    createTestPageOne(),
                    createTestPageTwo(),
                    createTestPageThree()
                ];

                elementLayouts.forEach(layoutElement => {
                    resultsContainer.appendChild(layoutElement);
                    resultsContainer.appendChild(document.createElement('hr'));
                });
            } else {
                const fallback = document.createElement('p');
                fallback.textContent = 'No matching layout layouts found.';
                resultsContainer.appendChild(fallback);
            }
        }

        searchButton.addEventListener('click', () => {
            const params = new URLSearchParams();
            params.set('q', searchInput.value);

            const newUrl = window.location.pathname + '?' + params.toString();
            window.history.pushState({}, '', newUrl);

            updateUIFromURL();
        });

        window.addEventListener('DOMContentLoaded', updateUIFromURL);
        window.addEventListener('popstate', updateUIFromURL);
    </script>
  </body>
</html>
